{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>
    {% block title %}
        Skill Swap
    {% endblock %}
</title>

<link rel="stylesheet"
      href="{% static 'css/style.css' %}">


</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav class="navbar">


<div class="logo">
    🔄 <span>Skill Swap</span>
</div>


<div class="nav-links">

    {% if user.is_authenticated %}

        <a href="/">
            🏠 Home
        </a>

        <a href="{% url 'profile' %}">
            👤 Profile
        </a>

        <a href="{% url 'users' %}">
            👥 Users
        </a>

        <a href="{% url 'search_users' %}">
            🔍 Search
        </a>

        <a href="{% url 'recommended_users' %}">
            🎯 Recommended
        </a>

        <a href="{% url 'inbox' %}">
            📥 Inbox
        </a>

        <a href="{% url 'connections' %}">
            🤝 Connections
        </a>

        <a href="{% url 'logout' %}">
            🚪 Logout
        </a>

    {% else %}

        <a href="{% url 'login' %}">
            🔐 Login
        </a>

        <a href="{% url 'signup' %}">
            📝 Signup
        </a>

    {% endif %}

</div>


</nav>

<!-- ================= MAIN CONTENT ================= -->

<main class="main-container">


{% block content %}

{% endblock %}


</main>

</body>

</html>
